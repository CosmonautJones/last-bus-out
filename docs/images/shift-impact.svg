<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc">
  <title id="title">Thirty minutes earlier: from zero to 1,699 round trips</title>
  <desc id="desc">In the recorded demo's fictional Romulus warehouse posting, the shift runs from 3:00 PM to 11:30 PM. An estimated 1,867 car-free households can get there, but zero can make the round trip. Keeping the start at 3:00 PM and changing the end to 11:00 PM yields an estimated 1,699 car-free households able to make the round trip. These are schedule-based demo estimates, not live travel guarantees.</desc>
  <rect x="1" y="1" width="1278" height="538" rx="18" fill="#f3f5f8" stroke="#dfe4ea" stroke-width="2"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="54" y="61" fill="#0f1b2a" font-size="36" font-weight="750" letter-spacing="-0.7">One shift. Two very different outcomes.</text>
    <text x="54" y="96" fill="#44505c" font-size="19">The same job site. The same 3:00 PM start. An earlier finish.</text>
    <path d="M54 121H1226" stroke="#d0d8e2" stroke-width="1"/>

    <path d="M54 159V423" stroke="#f39c12" stroke-width="5"/>
    <text x="78" y="172" fill="#8a5300" font-size="17" font-weight="700" letter-spacing="1.8">POSTED SHIFT</text>
    <text x="78" y="216" fill="#0f1b2a" font-size="33" font-weight="700">3:00 PM to 11:30 PM</text>
    <text x="75" y="333" fill="#9a5700" font-size="112" font-weight="800" letter-spacing="-4">0</text>
    <text x="78" y="372" fill="#0f1b2a" font-size="23" font-weight="600">car-free households can</text>
    <text x="78" y="402" fill="#0f1b2a" font-size="23" font-weight="600">make the round trip</text>
    <text x="78" y="448" fill="#44505c" font-size="20">1,867 can get there. None can get home.</text>

    <g transform="translate(640 288)">
      <circle r="37" fill="#0f62fe"/>
      <path d="M-16 0H16M5-11L16 0L5 11" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="68" fill="#0043ce" text-anchor="middle" font-size="17" font-weight="700">30 MINUTES</text>
      <text x="0" y="91" fill="#0043ce" text-anchor="middle" font-size="17" font-weight="700">EARLIER</text>
    </g>

    <path d="M770 159V423" stroke="#1a9850" stroke-width="5"/>
    <text x="794" y="172" fill="#126b39" font-size="17" font-weight="700" letter-spacing="1.8">TRY AN EARLIER END</text>
    <text x="794" y="216" fill="#0f1b2a" font-size="33" font-weight="700">3:00 PM to 11:00 PM</text>
    <text x="789" y="333" fill="#126b39" font-size="112" font-weight="800" letter-spacing="-4">1,699</text>
    <text x="794" y="372" fill="#0f1b2a" font-size="23" font-weight="600">car-free households can</text>
    <text x="794" y="402" fill="#0f1b2a" font-size="23" font-weight="600">make the round trip</text>
    <text x="794" y="448" fill="#44505c" font-size="20">A bus there. And a bus back.</text>

    <path d="M54 477H1226" stroke="#d0d8e2" stroke-width="1"/>
    <text x="54" y="512" fill="#44505c" font-size="17">Recorded demo · fictional Romulus posting · schedule-based estimates</text>
    <text x="1226" y="512" text-anchor="end" fill="#44505c" font-size="17">One-seat rides only</text>
  </g>
</svg>
